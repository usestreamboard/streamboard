name: Release (PyPI)

on:
  push:
    tags:
      - "sdk-python-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing — PyPI verifies this workflow via OIDC, no token
    # required. Configure the pending publisher at
    # https://pypi.org/manage/account/publishing/ to bind:
    #   owner:    usestreamboard
    #   repo:     streamboard
    #   workflow: release-pypi.yml
    #   env:      pypi
    environment:
      name: pypi
      url: https://pypi.org/p/streamboard
    permissions:
      id-token: write   # required for OIDC
      contents: read
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-python/dist
