[project]
name = "streamboard"
version = "0.1.0"
description = "Python client for pushing live data to a streamboard (KPIs, charts, tables) without re-asking an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "streamboard" }]
keywords = ["streamboard", "dashboard", "live-data", "sdk"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://usestreamboard.com"

[project.scripts]
streamboard-codegen = "streamboard.codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamboard"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]
