[project]
name = "streamboard"
version = "0.3.0"
description = "Python client for pushing live data to a streamboard (KPIs, charts, tables) without re-asking an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jacob Cable", email = "support@usestreamboard.com" }]
keywords = ["streamboard", "dashboard", "live-data", "mcp", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://usestreamboard.com"
Documentation = "https://usestreamboard.com/docs"
Repository = "https://github.com/usestreamboard/streamboard"
Issues = "https://github.com/usestreamboard/streamboard/issues"

[project.scripts]
streamboard-codegen = "streamboard.codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamboard"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]
